[package]
name = "war-room"
version = "0.1.0"
description = "A local-first AI War Room MVP"
authors = ["War Room"]
edition = "2021"

[lib]
name = "war_room_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
